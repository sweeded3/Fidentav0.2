name: Fix mobile menu V2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          perl -0pi -e 's/>Отправляем договор</>Скачать договор</g' index.html
          perl -0pi -e 's#(<nav class="nav" aria-label="Навигация">)#<button class="mobile-menu-toggle" type="button" aria-label="Меню" aria-expanded="false"><span></span><span></span><span></span></button>\n      $1#' index.html
          perl -0pi -e 's#</style>#.mobile-menu-toggle{display:none}@media(max-width:740px){.topbar__inner{position:relative}.mobile-menu-toggle{display:inline-flex;width:46px;height:46px;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:1px solid var(--line-strong);background:rgba(255,250,241,.7);margin-left:auto}.mobile-menu-toggle span{width:20px;height:2px;background:var(--ink);display:block;transition:.2s}.topbar.is-menu-open .mobile-menu-toggle span:nth-child(1){transform:translateY(7px) rotate(45deg)}.topbar.is-menu-open .mobile-menu-toggle span:nth-child(2){opacity:0}.topbar.is-menu-open .mobile-menu-toggle span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}.nav{position:absolute;left:14px;right:14px;top:calc(100% + 10px);display:grid!important;padding:8px 14px;background:rgba(255,250,241,.98);border:1px solid var(--line);box-shadow:0 18px 48px rgba(68,50,28,.16);opacity:0;pointer-events:none;transform:translateY(-8px);transition:.2s;z-index:80}.topbar.is-menu-open .nav{opacity:1;pointer-events:auto;transform:none}.nav a{padding:12px 0!important;border-bottom:1px solid var(--line);font-size:15px}.nav a:last-child{border-bottom:0}}\n</style>#' index.html
          perl -0pi -e 's#</body>#<script>const tb=document.querySelector(".topbar"),mt=document.querySelector(".mobile-menu-toggle");if(tb&&mt){const c=()=>{tb.classList.remove("is-menu-open");mt.setAttribute("aria-expanded","false")};mt.addEventListener("click",()=>{const o=tb.classList.toggle("is-menu-open");mt.setAttribute("aria-expanded",o?"true":"false")});document.querySelectorAll(".nav a").forEach(a=>a.addEventListener("click",c));document.addEventListener("keydown",e=>{if(e.key==="Escape")c()})}</script>\n</body>#' index.html
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! git diff --quiet; then git add index.html; git commit -m "Fix V2 mobile menu"; git push; fi
