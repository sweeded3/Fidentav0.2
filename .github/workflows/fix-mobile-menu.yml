name: Fix mobile menu

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add compact mobile menu
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'mobile-menu-toggle' not in s:
              s = s.replace('<div class="top-actions">','<button class="mobile-menu-toggle" type="button" aria-label="Меню" aria-expanded="false"><span></span><span></span><span></span></button><div class="top-actions">',1)
          css = """
    /* Mobile menu fix */
    .mobile-menu-toggle{display:none}
    @media(max-width:740px){
      .topbar__inner{position:relative;gap:12px}
      .mobile-menu-toggle{display:inline-flex;width:46px;height:46px;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:1px solid var(--line-strong);background:rgba(255,250,241,.7);margin-left:auto;color:var(--ink)}
      .mobile-menu-toggle span{display:block;width:20px;height:2px;background:currentColor;transition:.22s ease}
      .topbar.is-menu-open .mobile-menu-toggle span:nth-child(1){transform:translateY(7px) rotate(45deg)}
      .topbar.is-menu-open .mobile-menu-toggle span:nth-child(2){opacity:0}
      .topbar.is-menu-open .mobile-menu-toggle span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
      .nav{position:absolute;left:14px;right:14px;top:calc(100% + 8px);display:grid!important;gap:0;padding:8px 14px;background:rgba(255,250,241,.98);border:1px solid var(--line);box-shadow:0 18px 48px rgba(68,50,28,.16);opacity:0;pointer-events:none;transform:translateY(-8px);transition:.2s ease;z-index:80}
      .topbar.is-menu-open .nav{opacity:1;pointer-events:auto;transform:translateY(0)}
      .nav a{padding:12px 0!important;border-bottom:1px solid var(--line);font-size:15px;color:var(--ink-soft)}
      .nav a:last-child{border-bottom:0}
      .nav a.active:after{display:none}
    }
          """
          if 'Mobile menu fix' not in s:
              s = s.replace('</style>', css + '\n  </style>', 1)
          js = """
<script>
  const fidentaTopbar = document.querySelector('.topbar');
  const fidentaMenuToggle = document.querySelector('.mobile-menu-toggle');
  if (fidentaTopbar && fidentaMenuToggle) {
    const closeFidentaMenu = () => {
      fidentaTopbar.classList.remove('is-menu-open');
      fidentaMenuToggle.setAttribute('aria-expanded','false');
    };
    fidentaMenuToggle.addEventListener('click', () => {
      const open = fidentaTopbar.classList.toggle('is-menu-open');
      fidentaMenuToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    document.querySelectorAll('.nav a').forEach(a => a.addEventListener('click', closeFidentaMenu));
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeFidentaMenu(); });
  }
</script>
          """
          if 'fidentaMenuToggle' not in s:
              s = s.replace('</body>', js + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add index.html
            git commit -m "Fix mobile menu"
            git push
          fi
