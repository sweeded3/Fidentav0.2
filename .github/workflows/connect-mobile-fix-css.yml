name: Connect mobile fix CSS

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add mobile-fix stylesheet link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          link = '  <link rel="stylesheet" href="mobile-fix.css">\n'
          if 'href="mobile-fix.css"' not in s:
              anchor = '  <style>\n'
              s = s.replace(anchor, link + anchor, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add index.html
            git commit -m "Connect V2 mobile fix stylesheet"
            git push
          fi
